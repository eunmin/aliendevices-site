<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alien Devices</title>
<meta name="description" content="Alien Devices — independent app studio based in Seoul.">
<style>
  :root { --bg:#0a0a0a; --fg:#ededed; --muted:#8c8c8c; --accent:#ffffff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; min-height:100vh; line-height:1.6;
  }
  main { flex:1; display:flex; flex-direction:column; justify-content:center;
         max-width:720px; width:100%; margin:0 auto; padding:64px 24px; }
  .mark { font-size:44px; margin-bottom:20px; }
  h1 { font-size:clamp(36px,7vw,56px); letter-spacing:-0.02em; font-weight:700; }
  h1 span { color:var(--muted); }
  .lead { margin-top:16px; font-size:18px; color:var(--muted); max-width:520px; }
  .contact { margin-top:32px; }
  .contact a { color:var(--fg); text-decoration:none; border-bottom:1px solid var(--muted); padding-bottom:2px; }
  footer { border-top:1px solid #222222; padding:24px; font-size:12.5px; color:var(--muted); }
  footer .inner { max-width:720px; margin:0 auto; }
  footer dl { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; }
  footer dt { color:#5e5e5e; }
  footer .copy { margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Alien <span>Devices</span></h1>
  <p class="lead">An independent app studio in Seoul, building small, well-made apps for iPhone and Android.</p>
  <p class="contact">Contact — <a href="mailto:eunmin@aliendevices.fly">eunmin@aliendevices.fly</a></p>
</main>
<footer>
  <div class="inner">
    <dl>
      <dt>상호</dt><dd>에일리언 디바이스 (Alien Devices)</dd>
      <dt>대표자</dt><dd>김은민</dd>
      <dt>사업자등록번호</dt><dd>252-02-03636</dd>
      <dt>통신판매업 신고</dt><dd>신고 진행 중</dd>
      <dt>주소</dt><dd>서울특별시 마포구 독막로18길 5</dd>
      <dt>이메일</dt><dd>eunmin@aliendevices.fly</dd>
    </dl>
    <p class="copy">© 2026 Alien Devices</p>
  </div>
</footer>
</body>
</html>
